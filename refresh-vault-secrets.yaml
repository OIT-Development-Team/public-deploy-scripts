# Bumps GitOps manifest annotations to refresh ExternalSecrets from Vault and restart pods.
# Does not rebuild the Docker image or run a full deploy — use build-v3.yaml for that.
name: Refresh Vault Secrets & Restart

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to refresh secrets and restart in
        required: true
        default: test
        type: choice
        options:
          - test
          - prod

jobs:
  refresh-vault-secrets:
    uses: ua-app-images/build-laravel-app-image/.github/workflows/refresh-vault-secrets.yml@test
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      environment: ${{ inputs.environment }}
